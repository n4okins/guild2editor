name: Reconstruct verified v7.30 payload

on:
  push:
    branches: [fix/v730-save-serialization]
    paths:
      - '.payload/READY'

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Reconstruct verified files
        shell: bash
        run: |
          set -euo pipefail
          cat .payload/chunk-* > /tmp/payload.b64
          base64 -d /tmp/payload.b64 > /tmp/payload.tgz
          echo '5b7c2fd5c7ee57c0232eb81c0a2d6cd6bdc4c5c7641bfc6a9532cee6d3e3ce90  /tmp/payload.tgz' | sha256sum -c -
          tar -xzf /tmp/payload.tgz -C .
          rm -rf .payload
          rm -f .github/workflows/reconstruct-v730.yml
          node --check js/bplist.js
          node --check js/keyed.js
          node --check js/model.js
          node --check js/app.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply verified v7.30 save safety build'
          git push origin HEAD:fix/v730-save-serialization
