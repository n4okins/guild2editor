name: Apply v0.5 editor patch

on:
  push:
    branches: [feature/magic-bonuses-premium]
    paths: [.github/workflows/apply-v050.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/magic-bonuses-premium
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/apply_v050_patch.py')
          s=p.read_text()
          s=s.replace('out,n=re.subn(pattern,repl,text,count=1,flags=flags)','out,n=re.subn(pattern,lambda _m: repl,text,count=1,flags=flags)')
          p.write_text(s)
          PY
          python tools/apply_v050_patch.py
      - name: Validate syntax
        run: |
          node --check js/app.js
          node --check js/model.js
          python -m json.tool data/rules.json >/dev/null
          python -m json.tool data/wiki_items.json >/dev/null
          python -m json.tool data/magic_creatures.json >/dev/null
          python -m json.tool data/abnormal_flags.json >/dev/null
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js js/model.js index.html css/v040.css data/items.tsv data/rules.json data/wiki_items.json .github/workflows/web-validate.yml
          git commit -m "Implement v0.5 flags, magic creatures and premium time"
          git push origin HEAD:feature/magic-bonuses-premium
