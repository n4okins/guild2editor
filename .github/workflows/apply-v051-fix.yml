name: Apply v0.5.1 repair patch

on:
  push:
    branches: [fix/abnormal-superrare-format]
    paths: [.github/workflows/apply-v051-fix.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/abnormal-superrare-format
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize patch matchers
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/apply_v051_fix.py')
          s=p.read_text()
          def replace_assignment(name,next_name,value):
              global s
              a=s.index(name+'=')
              b=s.index(next_name+'=',a)
              s=s[:a]+f'{name}=r"{value}"\n'+s[b:]
          replace_assignment('old_block','new_block',r'function addonAllocation\(\)\{.*?(?=function parsePremiumTime\(\))')
          replace_assignment('old_ab','new_ab',r'function abnormalFlagReport\(\)\{.*?(?=function flush\(\))')
          replace_assignment('old_item','new_item',r'function itemParts\(code\)\{.*?(?=function summary\(\))')
          a=s.index('pat=r"function renderItems')
          b=s.index('\nold_match=',a)
          s=s[:a]+'pat=r"function renderItems\\(\\)\\{.*?(?=function addItem\\(\\))"'+s[b:]
          p.write_text(s)
          PY
      - name: Apply fix
        run: python tools/apply_v051_fix.py
      - name: Validate generated files
        run: |
          node --check js/app.js
          node --check js/model.js
          python -m json.tool data/catalog.json >/dev/null
          python -m json.tool data/rules.json >/dev/null
          grep -q 'BBBBUUTTGGGG' data/catalog.json
          grep -q 'sysAPov' js/model.js
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js js/model.js index.html data/catalog.json data/rules.json .github/workflows/web-validate.yml
          git commit -m "Fix addon budget detection and super-rare item flags"
          git push origin HEAD:fix/abnormal-superrare-format
