name: Validate v7.30 material mappings
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  material-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate observed and static warehouse material mappings
        run: |
          node <<'NODE'
          const fs=require('fs');
          const o=JSON.parse(fs.readFileSync('data/current_material_overrides.json','utf8'));
          const titlePolicy=JSON.parse(fs.readFileSync('data/magic_material_title_policy.json','utf8'));
          const byId=new Map(o.items.map(x=>[x.base_id,x]));
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          assert(o.categories['16']==='合成素材','items16 must be synthesis materials');
          assert(o.categories['17']==='魔造素材','items17 must be magic materials');
          assert(o.categories['18']==='予約/未使用','items18 must remain reserved/unused');

          assert(byId.get('7507')?.name==='棘鎌','7507 mapping mismatch');
          assert(byId.get('7509')?.name==='岩鱗','7509 mapping mismatch');
          assert(byId.get('7509')?.confidence==='confirmed','7509 quantity anchor must remain confirmed');
          assert(byId.get('7528')?.name==='ウサギのしっぽ','7528 mapping mismatch');

          const magic=o.items.filter(x=>Number(x.category_id)===17);
          const confirmed=magic.filter(x=>x.confidence==='confirmed');
          const inferred=magic.filter(x=>x.confidence!=='confirmed');
          assert(magic.length===38,`expected 38 magic materials, got ${magic.length}`);
          assert(confirmed.length===37,`expected 37 v5.10-confirmed magic materials, got ${confirmed.length}`);
          assert(inferred.length===1 && inferred[0].base_id==='8038' && inferred[0].name==='オメガ','Omega must be the sole inferred magic material');

          for(let id=8001;id<=8037;id++){
            const key=String(id);
            assert(byId.has(key),`missing confirmed magic material ${key}`);
            assert(byId.get(key).confidence==='confirmed',`${key} must be confirmed`);
          }
          assert(byId.get('8001')?.name==='ゴリアテ','8001 mapping mismatch');
          assert(byId.get('8004')?.name==='ホワイトドラゴン','8004 mapping mismatch');
          assert(byId.get('8008')?.name==='タロス','8008 mapping mismatch');
          assert(byId.get('8024')?.name==='サリエル','8024 mapping mismatch');
          assert(byId.get('8026')?.name==='銀竜','8026 mapping mismatch');
          assert(byId.get('8032')?.name==='ウィルオウィスプ','8032 mapping mismatch');
          assert(byId.get('8035')?.name==='ネメアーの獅子','8035 mapping mismatch');
          assert(!o.items.some(x=>x.base_id==='8004'&&x.name==='絵本'),'8004 must not map to 絵本');

          const orders=magic.map(x=>Number(x.display_order));
          assert(new Set(orders).size===38 && Math.min(...orders)===1 && Math.max(...orders)===38,'magic-material display order must cover 1..38');

          const preload=fs.readFileSync('js/preload-definitions.js','utf8');
          for(const s of ['current_material_overrides.json','isRejectedWarehouseCatalogRow','clearRejectedSequentialGuesses',"wiki.ordered['16']","wiki.ordered['17']",'magic.map(item => item.name)'])
            assert(preload.includes(s),`preload missing ${s}`);
          assert(preload.includes('category === 17 && id >= 8001 && id <= 8097'),'old 80xx sequential rows must be filtered');
          assert(preload.includes('id >= 8501 && id <= 8538'),'legacy 85xx warehouse rows must be filtered');

          const app=fs.readFileSync('js/app.js','utf8');
          const model=fs.readFileSync('js/model.js','utf8');
          const titlePatch=fs.readFileSync('js/magic-material-titles.js','utf8');
          assert(app.includes("x.base_id+ultra+title+'0000'"),'base item code construction changed unexpectedly');
          assert(model.includes('ensureItemDiscovery(code);state.dirty=true;loadInventory();'),'addInventory must synchronize discovery flags');
          assert(model.includes('const base=String(Number(code.slice(0,4)));return [G2MD5(base),G2MD5(code)]'),'discovery hash rule changed unexpectedly');
          assert(titlePolicy.category_id===17 && titlePolicy.code_layout==='BBBBUUTTGGGG','category 17 title policy mismatch');
          assert(titlePolicy.write_behavior.titled_material.includes('do not normalize category 17'),'category 17 titles must be preserved');
          assert(titlePatch.includes('preserved_category17:true'),'runtime patch must preserve titled category-17 material codes');
          assert(titlePatch.includes('M.addInventory(17,code,q)'),'runtime patch must write titled materials to items17');
          NODE
      - name: JavaScript syntax
        run: |
          node --check js/preload-definitions.js
          node --check js/magic-material-titles.js
