name: Apply material and magic item fix

on:
  push:
    branches: [fix/material-magic-item-add]
    paths: [.github/workflows/apply-material-magic-fix.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/material-magic-item-add
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply malformed material repair
        run: python tools/apply_material_magic_followup.py
      - name: Validate generated files
        run: |
          node --check js/app.js
          node --check js/model.js
          grep -q 'repairSpecialMaterialCodes' js/model.js
          grep -q 'canonicalPlainMaterialCode' js/model.js
          grep -q 'M.repairSpecialMaterialCodes()' js/app.js
      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/model.js js/app.js
          git commit -m "Repair malformed material and magic item IDs"
          git push origin HEAD:fix/material-magic-item-add
