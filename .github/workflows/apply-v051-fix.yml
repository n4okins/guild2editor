name: Apply addon maximum patch

on:
  push:
    branches: [fix/abnormal-superrare-format]
    paths: [.github/workflows/apply-v051-fix.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/abnormal-superrare-format
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply current addon maximum fix
        run: python tools/apply_addon_max_patch.py
      - name: Validate generated files
        run: |
          node --check js/app.js
          node --check js/model.js
          python -m json.tool data/catalog.json >/dev/null
          python -m json.tool data/rules.json >/dev/null
          grep -q 'current_pow_max' data/rules.json
          grep -q 'unlockAddonMaximum' js/model.js
          grep -q '23ptへ拡張' js/app.js
          grep -q "x.base_id+ultra+title+'0000'" js/app.js
      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js js/model.js index.html data/rules.json
          git commit -m "Support current 23-point addon maximum"
          git push origin HEAD:fix/abnormal-superrare-format
# retry 2
